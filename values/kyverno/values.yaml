crds:
  install: true
global:
  crdWatcher: true
  tolerations:
  - effect: NoSchedule
    key: CriticalAddonsOnly
    value: "true"
  - effect: NoSchedule
    key: karpenter.sh/controller
    value: "true"
admissionController:
  replicas: 3
  topologySpreadConstraints:
    - maxSkew: 1
      minDomains: 2
      topologyKey: "topology.kubernetes.io/zone"
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: admission-controller
    - maxSkew: 1
      minDomains: 3
      topologyKey: "kubernetes.io/hostname"
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: admission-controller
backgroundController:
  replicas: 2
  topologySpreadConstraints:
    - maxSkew: 1
      minDomains: 2
      topologyKey: "topology.kubernetes.io/zone"
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: background-controller
    - maxSkew: 1
      minDomains: 2
      topologyKey: "kubernetes.io/hostname"
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: background-controller
cleanupController:
  replicas: 1
reportsController:
  replicas: 1

# The chart's pre-delete hook scales Kyverno to 0 and cleans up the dynamic
# webhook configurations Kyverno creates at runtime. We don't need it: when
# we tear down a sandbox the cluster goes with it, so any orphaned webhook
# configs are deleted as part of the cluster delete.
webhooksCleanup:
  enabled: false
